    <!-- Schema.org JSON-LD: Organization + WebSite.
         The founder edge points at the Person node defined on shashankmadala.com,
         which reciprocally asserts worksFor/founder back at this #organization id.
         Keep the two graphs consistent: changing name, url, logo, foundingDate or
         nonprofitStatus here means updating the mirrored org node there too. -->

    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": ["EducationalOrganization", "NGO"],
          "@id": "https://www.luminlearning.org/#organization",
          "name": "Lumin AI",
          "alternateName": "Lumin",
          "url": "https://www.luminlearning.org/",
          "logo": {
            "@type": "ImageObject",
            "@id": "https://www.luminlearning.org/#logo",
            "url": "https://www.luminlearning.org/images/lumin.png",
            "contentUrl": "https://www.luminlearning.org/images/lumin.png",
            "caption": "Lumin AI"
          },
          "image": { "@id": "https://www.luminlearning.org/#logo" },
          "description": "Lumin AI is a student-founded 501(c)(3) nonprofit expanding access to AI education for students in grades 6-12. We deliver hands-on AI programming to thousands of students worldwide.",
          "foundingDate": "2023",
          "nonprofitStatus": "Nonprofit501c3",
          "founder": [
            { "@id": "https://www.shashankmadala.com/#person" },
            { "@id": "https://www.luminlearning.org/founders#ayur-munipalli" }
          ],
          "email": "luminai321@gmail.com",
          "telephone": "+1-609-200-0017",
          "areaServed": { "@type": "Place", "name": "Worldwide" },
          "knowsAbout": [

            "Teacher professional development"

            "https://luminlearning.ai/",
            "https://www.linkedin.com/company/lumin-ai-321",
            "https://www.instagram.com/lumin.ai"
          ]
        },
        {
          "@type": "Person",
          "@id": "https://www.luminlearning.org/founders#ayur-munipalli",
          "name": "Ayur Munipalli",
          "jobTitle": "Founder and Co-CEO, Lumin AI",
          "worksFor": { "@id": "https://www.luminlearning.org/#organization" },
          "sameAs": [
            "https://www.linkedin.com/in/ayur-munipalli/",
            "https://github.com/ayurmunipalli"
          ]

          "@type": "WebSite",

          "copyrightHolder": { "@id": "https://www.luminlearning.org/#organization" }
        }
      ]
    }
